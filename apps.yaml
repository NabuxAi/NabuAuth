# NabuAuth configuration.
#
# This file is the source of truth for which applications may sign Nabu users
# in. Secrets are never written here — each app names an environment variable
# and the value is read from the process environment at boot.

server:
  port: 8099
  issuer: ${NABUAUTH_ISSUER}
  access_token_ttl: 1h
  refresh_token_ttl: 720h   # 30 days
  session_ttl: 720h
  code_ttl: 10m
  # Off means an administrator creates accounts. The sign-up form stays reachable
  # while the database has no users at all, so a fresh deployment can be claimed.
  #
  # Read from the environment so a deployment can open or close sign-up without
  # a code change. Unset expands to empty, which is off — the safe default.
  allow_registration: ${NABUAUTH_ALLOW_REGISTRATION}

# Every scope an app may request, with the sentence the user reads on the
# consent screen. An app requesting a scope that is not listed here is refused.
scopes:
  openid: Confirm your Nabu identity
  profile: Your name, avatar and phone number
  email: Your email address
  wallet: Read your wallet balance and activity
  wallet.write: Charge your wallet for the usage you incur
  offline: Stay signed in when you are away

apps:
  - id: nabugate
    name: NabuGate AI
    description: Unified LLM, vision and multi-model gateway
    icon: cpu-chip
    url: https://gate.nabuxai.com
    badge: Active
    redirect_uris:
      - https://gate.nabuxai.com/admin/api/nabu/callback
    # NabuGate also meters usage, so it is the one app that may charge a wallet.
    scopes: [openid, profile, email, wallet, wallet.write, offline]
    secret_env: NABUAUTH_SECRET_NABUGATE

  - id: nabudesk
    name: NabuDesk
    description: Omnichannel AI support and operations workspace
    icon: chat-bubble-left-right
    url: https://desk.nabuxai.com
    badge: Active
    redirect_uris:
      - https://desk.nabuxai.com/auth/nabu/callback
    scopes: [openid, profile, email, wallet, offline]
    secret_env: NABUAUTH_SECRET_NABUDESK

  - id: nabugen
    name: NabuGen
    description: Multimodal image, video and asset generation
    icon: photo
    url: https://gen.nabuxai.com
    badge: Active
    redirect_uris:
      - https://gen.nabuxai.com/auth/nabu/callback
    scopes: [openid, profile, email, wallet, offline]
    secret_env: NABUAUTH_SECRET_NABUGEN

  - id: nabuvoice
    name: NabuVoice
    description: Text-to-speech and speech synthesis platform
    icon: speaker-wave
    url: https://voice.nabuxai.com
    badge: Active
    redirect_uris:
      - https://voice.nabuxai.com/auth/nabu/callback
    scopes: [openid, profile, email, wallet, offline]
    secret_env: NABUAUTH_SECRET_NABUVOICE

  - id: nabuwrite
    name: NabuWrite
    description: AI narrative and long-form content engine
    icon: pencil-square
    url: https://write.nabuxai.com
    badge: Active
    redirect_uris:
      - https://write.nabuxai.com/api/auth/nabu/callback
    scopes: [openid, profile, email, wallet, offline]
    secret_env: NABUAUTH_SECRET_NABUWRITE

  - id: reelmind
    name: ReelMind
    description: Instagram archives turned into a searchable knowledge base
    icon: film
    url: https://reelmind.nabuxai.com
    badge: Active
    redirect_uris:
      - https://reelmind.nabuxai.com/panel/auth/callback
    # No wallet: ReelMind's AI spend is metered by NabuGate against its own
    # project token, so an operator's wallet is not involved.
    scopes: [openid, profile, email, offline]
    secret_env: NABUAUTH_SECRET_REELMIND

# Not yet registered, because they have no sign-in callback to register:
#
#   nabusu       — no account system at all; it is a local companion talking to
#                  the gateway through a thin proxy.
#   nabux-store  — has a User model but no authentication layer.
#   nabuwatch    — authenticates locally with passkeys on purpose: it is built to
#                  run air-gapped, and single sign-on needs outbound internet.
#
# Add an entry here once one of them implements /auth/nabu/callback.
