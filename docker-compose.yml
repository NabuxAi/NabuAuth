services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      NABUAUTH_ISSUER: ${NABUAUTH_ISSUER:-https://auth.nabuxai.com}
      DATABASE_URL: postgres://${DB_USERNAME:-nabuauth}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE:-nabuauth}?sslmode=disable
      # One secret per ecosystem app. An app whose secret is missing is still
      # registered but cannot complete a token exchange, and the server says so
      # in its startup log instead of failing later inside a redirect.
      NABUAUTH_SECRET_NABUGATE: ${NABUAUTH_SECRET_NABUGATE}
      NABUAUTH_SECRET_NABUDESK: ${NABUAUTH_SECRET_NABUDESK}
      NABUAUTH_SECRET_NABUGEN: ${NABUAUTH_SECRET_NABUGEN}
      NABUAUTH_SECRET_NABUVOICE: ${NABUAUTH_SECRET_NABUVOICE}
      NABUAUTH_SECRET_NABUWRITE: ${NABUAUTH_SECRET_NABUWRITE}
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.nabuauth.rule=Host(`${COOLIFY_FQDN:-auth.nabuxai.com}`)"
      - "traefik.http.routers.nabuauth.entrypoints=https"
      - "traefik.http.routers.nabuauth.tls=true"
      - "traefik.http.routers.nabuauth.tls.certresolver=letsencrypt"
      - "traefik.http.services.nabuauth.loadbalancer.server.port=8099"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-nabuauth}
      POSTGRES_USER: ${DB_USERNAME:-nabuauth}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nabuauth}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
