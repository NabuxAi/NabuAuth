{{define "login.html"}}{{template "head" .}}
<main class="card">
  <h1>Sign in</h1>
  <p class="sub">One Nabu account for every app in the ecosystem.</p>
  {{if .Error}}<p class="alert" role="alert">{{.Error}}</p>{{end}}
  <form method="post" action="/login" class="form">
    <input type="hidden" name="next" value="{{.Next}}">
    <label>
      <span>Email</span>
      <input type="email" name="email" value="{{.Email}}" autocomplete="username" required autofocus>
    </label>
    <label>
      <span>Password</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="primary">Sign in</button>
  </form>
  {{if .AllowRegistration}}
  <p class="muted">No account yet? <a href="/register{{if .Next}}?next={{.Next}}{{end}}">Create one</a>.</p>
  {{end}}
</main>
{{template "foot" .}}{{end}}
