{{define "telegram_complete.html"}}{{template "auth-head" .}}
<div class="card">
  <span class="status-icon is-ok" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m8 12.3 2.8 2.8 5.2-5.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  <h1>{{t $.Lang "Telegram sign-in complete"}}</h1>
  <p class="sub">{{t $.Lang "You are signed in. This window should close automatically."}}</p>
  <a id="telegram-complete-continue" class="primary block" href="{{.Next}}">{{t $.Lang "Continue"}}</a>
</div>
<script src="/static/telegram-complete.js" defer></script>
{{template "auth-foot" .}}{{end}}
