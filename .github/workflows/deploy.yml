name: Deploy

# Nothing in this repository deployed it. A survey of twelve repositories in
# this fleet found none with a deployment workflow, so every merged change sat
# in main until somebody pressed a button by hand.
#
# This repository has no CI workflow, so there is nothing to wait for.
# Deploying straight from a push is worse than deploying after tests
# and far better than never deploying, which is what happens today.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-nabuauth
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check required configuration
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_API_URL }}
          RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
        run: |
          missing=""
          [ -n "$COOLIFY_TOKEN" ] || missing="$missing COOLIFY_API_TOKEN"
          [ -n "$COOLIFY_URL" ]   || missing="$missing COOLIFY_API_URL"
          [ -n "$RESOURCE_UUID" ] || missing="$missing COOLIFY_RESOURCE_UUID"

          if [ -n "$missing" ]; then
            echo "::error::Repository secrets not set:$missing"
            echo ""
            echo "Settings > Secrets and variables > Actions."
            echo ""
            echo "  COOLIFY_API_URL         https://cp.nabuxai.com/api/v1"
            echo "  COOLIFY_RESOURCE_UUID   j2ue225b0hefrajgia23gtp2"
            echo "  COOLIFY_API_TOKEN       Coolify > Keys & Tokens > API tokens,"
            echo "                          scoped to deploy this resource"
            echo ""
            echo "The UUID above was read from the running container serving"
            echo "auth.nabuxai.com, not guessed. Until these exist nothing here deploys."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Deploy and wait for the result
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
        run: ./scripts/coolify-deploy.sh
